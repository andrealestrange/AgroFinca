<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Letras con tilde y ñ -->
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título que sale en la pestaña del navegador -->
  <title>Crear cuenta | AGROFINCA</title>
  <!-- Descripción de la página (la usan los buscadores) -->
  <meta name="description" content="Crea tu cuenta en AGROFINCA para comprar productos agropecuarios.">
  <!-- Fuente Source Sans 3 desde Google Fonts (CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Conecta el archivo de estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CABECERA: barra verde de arriba con el logo y el menú -->
  <header class="site-header">
    <!-- Logo: al hacer clic lleva al inicio -->
    <a href="index.html" class="logo"><img src="img/logo.png" alt="Logo de AGROFINCA" class="logo-img"> AGROFINCA</a>
    <!-- MENÚ: los enlaces quedan uno al lado del otro (ver .site-header nav ul en el CSS) -->
    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="login.html">Mi cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="formulario" aria-labelledby="titulo-registro">
      <h1 id="titulo-registro">Crear cuenta</h1>

      <!-- FORMULARIO: el navegador valida solo con los atributos de cada campo -->
      <form action="#" method="post">

        <!-- required = obligatorio | minlength = mínimo de letras | pattern = solo letras y espacios -->
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="60"
               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo letras y espacios">

        <!-- type="email" revisa que tenga formato de correo (con @) -->
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="nombre@correo.com">

        <!-- pattern: 10 números y que empiece por 3 (celulares de Colombia) -->
        <label for="telefono">Número de teléfono</label>
        <input type="tel" id="telefono" name="telefono" required pattern="3[0-9]{9}"
               title="10 dígitos, empieza por 3" placeholder="3201234567">

        <!-- type="date" muestra calendario; min y max limitan las fechas permitidas -->
        <label for="nacimiento">Fecha de nacimiento</label>
        <input type="date" id="nacimiento" name="nacimiento" required min="1930-01-01" max="2008-12-31">
        <span class="ayuda">Debes ser mayor de edad.</span>

        <!-- type="password" oculta lo que se escribe; mínimo 6 caracteres -->
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required minlength="6" placeholder="Mínimo 6 caracteres">

        <label for="clave2">Confirmar contraseña</label>
        <input type="password" id="clave2" name="clave2" required minlength="6" placeholder="Escribe nuevamente la contraseña">

        <!-- Casilla obligatoria: no deja enviar si no se marca -->
        <label>
          <input type="checkbox" name="terminos" required> Acepto los <a href="#"><strong>términos y condiciones</strong></a>
        </label>

        <!-- Botón que envía el formulario -->
        <button type="submit" class="btn">Crear cuenta</button>
      </form>
    </section>
  </main>

  <!-- PIE DE PÁGINA: enlaces legales y derechos reservados -->
  <footer class="site-footer">
    <nav aria-label="Información legal">
      <a href="#">Términos y condiciones</a>
      <a href="#">Política de privacidad</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
    <p>© 2026 AgroFinca · Todos los derechos reservados · Sahagún, Córdoba, Colombia</p>
  </footer>

</body>
</html>
