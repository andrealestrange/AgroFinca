</head>
<body>

    <header class="site-header">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-boton" aria-label="Abrir menú">
          <span></span>
          <span></span>
          <span></span>
        </label>
      
        <a href="index.html" class="logo"><img src="img/logo.png" alt="Logo de AGROFINCA" class="logo-img"> AGROFINCA</a>
      
        <nav aria-label="Menú principal">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="login.html">Mi cuenta</a></li>
          </ul>
        </nav>
      </header>

  <main>
    <section class="formulario" aria-labelledby="titulo-registro">
      <h1 id="titulo-registro">Crear cuenta</h1>


      <form action="#" method="post">


        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="60"
               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo letras y espacios">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="nombre@correo.com">

        <label for="telefono">Número de teléfono</label>
        <input type="tel" id="telefono" name="telefono" required pattern="3[0-9]{9}"
               title="10 dígitos, empieza por 3" placeholder="3201234567">

        <label for="nacimiento">Fecha de nacimiento</label>
        <input type="date" id="nacimiento" name="nacimiento" required min="1930-01-01" max="2008-12-31">
        <span class="ayuda">Debes ser mayor de edad.</span>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required minlength="6" placeholder="Mínimo 6 caracteres">

        <label for="clave2">Confirmar contraseña</label>
        <input type="password" id="clave2" name="clave2" required minlength="6" placeholder="Escribe nuevamente la contraseña">

        <label>
          <input type="checkbox" name="terminos" required> Acepto los <a href="#"><strong>términos y condiciones</strong></a>
        </label>

        <button type="submit" class="btn">Crear cuenta</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">

      <a href="#">Términos y condiciones</a>
      <a href="#">Política de privacidad</a>

    </nav>

  </footer>

</body>
</html>
