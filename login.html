<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | AGROFINCA</title>
  <meta name="description" content="Inicia sesión en AGROFINCA para ver tu perfil y tus compras.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <header class="site-header">
    <a href="index.html" class="logo"><img src="img/logo.png" alt="Logo de AGROFINCA" class="logo-img"> AGROFINCA</a>
    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="login.html">Mi cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="formulario" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Iniciar sesión</h1>

      <form action="#" method="post">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required minlength="6">

        <button type="submit" class="btn">Iniciar sesión</button>
      </form>
      <p class="ayuda">¿No tienes cuenta? <a href="registro.html"><strong>Regístrate aquí</strong></a></p>
    </section>
  </main>

  <footer class="site-footer">
    <nav aria-label="Información legal">
      <a href="#">Términos y condiciones</a>
      <a href="#">Política de privacidad</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
    <p>© 2026 AgroFinca · Todos los derechos reservados · Sahagún, Córdoba, Colombia</p>
  </footer>

</body>
</html>
