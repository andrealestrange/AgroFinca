<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Letras con tilde y ñ -->
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título que sale en la pestaña del navegador -->
  <title>Iniciar sesión | AGROFINCA</title>
  <!-- Descripción de la página (la usan los buscadores) -->
  <meta name="description" content="Inicia sesión en AGROFINCA para ver tu perfil y tus compras.">
  <!-- Fuente Source Sans 3 desde Google Fonts (CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Conecta el archivo de estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CABECERA: barra verde de arriba con el logo y el menú -->
  <header class="site-header">
    <!-- Logo: al hacer clic lleva al inicio -->
    <a href="index.html" class="logo"><img src="img/logo.png" alt="Logo de AGROFINCA" class="logo-img"> AGROFINCA</a>
    <!-- MENÚ: los enlaces quedan uno al lado del otro (ver .site-header nav ul en el CSS) -->
    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="login.html">Mi cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="formulario" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Iniciar sesión</h1>

      <form action="#" method="post">
        <!-- Correo y contraseña obligatorios -->
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required minlength="6">

        <button type="submit" class="btn">Iniciar sesión</button>
      </form>
      <!-- Enlace para quien todavía no tiene cuenta -->
      <p class="ayuda">¿No tienes cuenta? <a href="registro.html"><strong>Regístrate aquí</strong></a></p>
    </section>
  </main>

  <!-- PIE DE PÁGINA: enlaces legales y derechos reservados -->
  <footer class="site-footer">
    <nav aria-label="Información legal">
      <a href="#">Términos y condiciones</a>
      <a href="#">Política de privacidad</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
    <p>© 2026 AgroFinca · Todos los derechos reservados · Sahagún, Córdoba, Colombia</p>
  </footer>

</body>
</html>
